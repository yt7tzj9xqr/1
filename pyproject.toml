[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportbench-minimax"
version = "0.1.0"
description = "Reproducible MiniMax baseline and dynamic citation-graph RAG for ReportBench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reportbench-mm = "reportbench_mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
